name: continuos-deployment
run-name: Deploy do App
on:
  # pull_request:
  #   branches:
  #     - main
  workflow_dispatch:
jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
              
      - name: Docker Login
        uses: docker/login-action@v3.4.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6.15.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: domeneghetti/devops-ci:latest # dockerhub

      - name: Azure WebApp
        uses: Azure/webapps-deploy@v3.0.1
        with:
          app-name: domeneghetti-devops-ci # meu app name
          publish-profile: ${{ secrets.PUBLISH_PROFILE }} # download no azure
          image: domeneghetti/devops-ci:latest # username alterar
  e2e-testing:
    name: e2e-testing
    runs-on: ubunto-latest
    needs: deploy

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v3.9.1
        with:
          node-version: '20'
      
      - name: Install Packages
        run: |
          cd integration-test
          npm i

      - name: Run E2E Cypress
        run: |
          cd integration-test
          npx cypress run